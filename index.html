<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#059669">
  <meta name="description" content="MRosecuador - Sistema de Configuración de Finca: Planos de Bloques y Catálogo de Variedades">
  <title>MRosecuador - Configuración de Finca</title>
  
  <!-- Favicon con Logo Corporativo -->
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  
  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos Corporativos Verde y Blanco -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ==============================================================================
       1. PANTALLA DE LOGIN ADAPTATIVO (MÓVILES, TABLETS Y ESCRITORIO)
       ============================================================================== -->
  <div id="auth-screen" class="auth-wrapper">
    
    <!-- Marcas de agua florales con la imagen de la rosa distribuidas en el fondo -->
    <div class="auth-watermark-grid" aria-hidden="true">
      <div class="watermark-item wm-1"><img src="assets/rose_watermark.jpg" alt="" class="wm-img"></div>
      <div class="watermark-item wm-2"><img src="assets/rose_watermark.jpg" alt="" class="wm-img"></div>
      <div class="watermark-item wm-3"><img src="assets/rose_watermark.jpg" alt="" class="wm-img"></div>
      <div class="watermark-item wm-4"><img src="assets/rose_watermark.jpg" alt="" class="wm-img"></div>
      <div class="watermark-item wm-5"><img src="assets/rose_watermark.jpg" alt="" class="wm-img"></div>
      <div class="watermark-item wm-6"><img src="assets/rose_watermark.jpg" alt="" class="wm-img"></div>
      <div class="watermark-item wm-7"><img src="assets/rose_watermark.jpg" alt="" class="wm-img"></div>
      <div class="watermark-item wm-8"><img src="assets/rose_watermark.jpg" alt="" class="wm-img"></div>
    </div>

    <div class="auth-card auth-card-split">
      <!-- Columna Izquierda: Solo el Logo Grande (Sin texto debajo) -->
      <div class="auth-left-col">
        <div class="auth-logo-showcase">
          <img src="assets/logo.jpg" alt="MRosecuador" class="auth-logo-img-large">
        </div>
      </div>

      <!-- Columna Derecha: Formulario y Accesos -->
      <div class="auth-right-col">
        <!-- Formulario de Autenticación -->
        <form id="form-login" class="auth-form" autocomplete="on">
          <div class="form-group">
            <label for="login-username" class="form-label">Usuario</label>
            <div class="input-container">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </span>
              <input type="text" id="login-username" class="form-control" placeholder="admin" required autofocus>
            </div>
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">
              <span>Contraseña</span>
            </label>
            <div class="input-container">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
              <button type="button" id="btn-toggle-password" class="input-btn-toggle" title="Mostrar/Ocultar contraseña">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <div class="auth-extra-row">
            <label class="checkbox-label">
              <input type="checkbox" id="login-remember" checked>
              <span>Recordar mi sesión</span>
            </label>
            <span style="font-size: 0.78rem; color: var(--emerald-main); font-weight: 600;">Acceso Seguro</span>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-submit-login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            Ingresar al Sistema
          </button>
        </form>

        <!-- Cuadro de Acceso Rápido -->
        <div class="demo-accounts">
          <div class="demo-title">Acceso rápido:</div>
          <div class="demo-pills" style="justify-content: center;">
            <button type="button" class="btn-demo-pill admin-pill" onclick="App.fillDemoAccount('admin', 'admin')">
              <span>Administrador</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==============================================================================
       2. ESPACIO DE TRABAJO PRINCIPAL (PANEL RESPONSIVO)
       ============================================================================== -->
  <div id="app-screen" class="app-layout" style="display: none;">
    
    <!-- Cortina de Fondo para Menú Móvil (Drawer) -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="App.closeMobileMenu()"></div>

    <!-- Menú Lateral Dinámico (Sidebar) -->
    <aside id="app-sidebar" class="app-sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.jpg" alt="Logo MRosecuador" class="sidebar-logo">
        <div class="sidebar-brand-text">
          <span class="brand-name">MRosecuador</span>
          <span class="brand-sub">Configuración de Finca</span>
        </div>
      </div>

      <!-- Contenedor Reactivo de Navegación -->
      <div class="sidebar-content" id="sidebar-nav-container">
        <!-- Renderizado dinámico vía App.updateSidebar() -->
      </div>

      <!-- Perfil de Usuario en Barra Lateral -->
      <div class="sidebar-footer">
        <div class="user-avatar" id="user-avatar-badge">AD</div>
        <div class="user-info">
          <div class="user-name" id="user-name-display">Administrador</div>
          <div class="user-role-badge" id="user-role-display">Administrador</div>
        </div>
        <button class="btn-sidebar-logout" onclick="App.handleLogout()" title="Cerrar Sesión">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </aside>

    <!-- Área Principal de la Aplicación -->
    <main class="app-main">
      <!-- Encabezado Superior Fijo (Header) -->
      <header class="app-header">
        <div class="header-left">
          <!-- Botón Hamburguesa Móvil / Tablet -->
          <button class="btn-toggle-menu" onclick="App.toggleMobileMenu()" title="Abrir Menú">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>

          <!-- Migas de Pan (Breadcrumbs) -->
          <div class="header-breadcrumbs">
            <span class="breadcrumb-root">MRosecuador</span>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current" id="header-breadcrumb-title">Planos de Finca</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Chip de Estado Operativo -->
          <div class="quick-chip">
            <span class="chip-dot"></span>
            <span>Sistema Operativo</span>
          </div>

          <!-- Botón de Salida Directa -->
          <button class="btn btn-secondary" style="padding: 0.45rem 0.85rem; font-size: 0.82rem;" onclick="App.handleLogout()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            <span style="display: none; @media(min-width:640px){display:inline;}">Salir</span>
          </button>
        </div>
      </header>

      <!-- Contenedor Dinámico de Vistas -->
      <div id="view-container" class="content-area">
        <!-- Renderizado dinámico de módulos -->
      </div>
    </main>

  </div>

  <!-- ==============================================================================
       3. MODAL DINÁMICO REUTILIZABLE
       ============================================================================== -->
  <div id="app-modal" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title-text">Título de la Ventana</h3>
        <button class="btn-icon-only" onclick="App.closeModal()" title="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body-content">
        <!-- Contenido dinámico del modal -->
      </div>
      <div class="modal-footer" id="modal-footer-content">
        <!-- Botones dinámicos del modal -->
      </div>
    </div>
  </div>

  <!-- ==============================================================================
       4. CONTENEDOR DE ALERTAS TOAST
       ============================================================================== -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ==============================================================================
       SCRIPTS JAVASCRIPT
       ============================================================================== -->
  <!-- Procesador de Excel .xlsx autónomo y local -->
  <script src="js/xlsx.full.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
